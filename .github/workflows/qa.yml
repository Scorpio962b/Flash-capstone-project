# CI quality gates for FlashGuard
# Runs on pull requests and pushes to main.

name: QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  API_DIR: tests/api

defaults:
  run:
    working-directory: FlashGuard

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FlashGuard/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npx eslint tests src

  sonar:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: FlashGuard

  e2e:
    name: UI + E2E + API + ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # CHANGED: env vars docker compose reads (no .env file in CI)
    env:
      API_PORT: '4000'
      WEB_PORT: '3000'
      MOBILE_PORT: '8081'
      DB_HOST: host.docker.internal
      DB_PORT: '1433'
      DB_NAME: FlashGuard
      DB_USER: sa
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'FlashGuard_CI_Passw0rd!' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-only-jwt-secret-not-for-prod' }}

    # CHANGED: throwaway SQL Server for CI (locally you use the one on your PC)
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'FlashGuard_CI_Passw0rd!' }}
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FlashGuard/package-lock.json

      - run: npm ci

      # CHANGED: new step
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 40); do
            if docker exec ${{ job.services.sqlserver.id }} \
                 /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$DB_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"; exit 0
            fi
            echo "Waiting for SQL Server ($i/40)..."; sleep 3
          done
          echo "::error::SQL Server did not start"
          docker logs ${{ job.services.sqlserver.id }}
          exit 1

      # CHANGED: new step - runs 01-schema.sql + 99-reset-and-seed.sql
      - name: Seed database
        run: docker compose --profile seed run --rm app-seed

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API and web app
        run: |
          for url in "http://localhost:${API_PORT}/health" "http://localhost:${WEB_PORT}"; do
            for i in $(seq 1 60); do
              curl -fsS "$url" > /dev/null && break
              sleep 3
            done

            curl -fsS "$url" > /dev/null || {
              echo "::error::$url did not come up"
              docker compose logs
              exit 1
            }
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: UI tests
        run: |
          mkdir -p results/ui
          npx cucumber-js --format junit:results/ui/junit.xml --format html:results/ui/cucumber-report.html

      - name: E2E tests
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results/e2e/junit.xml
        run: |
          mkdir -p results/e2e
          npx playwright test --reporter=list,html,junit,allure-playwright

      - name: API tests (Newman)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p results/api
          failed=0

          while IFS= read -r -d '' f; do
            name=$(basename "$f" .json)
            echo "--- $name"
            npx newman run "$f" -r cli,junit --reporter-junit-export "results/api/$name.xml" || failed=$((failed+1))
          done < <(find "$API_DIR" -name '*.json' ! -name '*environment*' -print0)

          echo "API: $failed collections failed"
          [ "$failed" -eq 0 ]

      - name: OWASP ZAP baseline scan
        if: ${{ !cancelled() }}
        run: |
          mkdir -p results/zap
          chmod 777 results/zap

          docker run --rm --network host \
            -v "$PWD/results/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "http://localhost:${WEB_PORT}" \
            -r zap-report.html -J zap-report.json -I

      - name: Metrics
        if: ${{ !cancelled() }}
        run: |
          node scripts/qa-metrics.mjs
          cat results/metrics/metrics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6          # CHANGED: v5 -> v6 (Node 24)
        with:
          name: playwright-report
          path: FlashGuard/playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6          # CHANGED
        with:
          name: test-results
          path: FlashGuard/results/
          if-no-files-found: ignore

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6          # CHANGED
        with:
          name: allure-results
          path: FlashGuard/allure-results/
          if-no-files-found: ignore

      # CHANGED: new step
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop stack
        if: always()
        continue-on-error: true                   # CHANGED: teardown can't mask the real error
        run: docker compose down -v

  allure:
    name: Allure report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FlashGuard/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - uses: actions/download-artifact@v6        # CHANGED
        with:
          name: allure-results
          path: FlashGuard/allure-results
        continue-on-error: true

      - name: Generate Allure report
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results)" ]; then
            npx allure-commandline generate allure-results -o allure-report --clean
          else
            echo "::warning::No Allure results to report"
          fi

      - uses: actions/upload-artifact@v6          # CHANGED
        with:
          name: allure-report
          path: FlashGuard/allure-report/
          if-no-files-found: ignore