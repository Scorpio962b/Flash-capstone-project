
# CI quality gates for FlashGuard
# Runs on pull requests and pushes to main.

name: QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  API_DIR: tests/api

defaults:
  run:
    working-directory: FlashGuard

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FlashGuard/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npx eslint tests src

  sonar:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: FlashGuard

  e2e:
    name: UI + E2E + API + ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FlashGuard/package-lock.json

      - run: npm ci

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API and web app
        run: |
          for url in http://localhost:4000/health http://localhost:3000; do
            for i in $(seq 1 60); do
              curl -fsS "$url" > /dev/null && break
              sleep 3
            done

            curl -fsS "$url" > /dev/null || {
              echo "::error::$url did not come up"
              docker compose logs
              exit 1
            }
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: UI tests
        run: |
          mkdir -p results/ui
          npx cucumber-js --format junit:results/ui/junit.xml --format html:results/ui/cucumber-report.html

      - name: E2E tests
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results/e2e/junit.xml
        run: |
          mkdir -p results/e2e
          npx playwright test --reporter=list,html,junit,allure-playwright

      - name: API tests (Newman)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p results/api
          failed=0

          while IFS= read -r -d '' f; do
            name=$(basename "$f" .json)
            echo "--- $name"
            npx newman run "$f" -r cli,junit --reporter-junit-export "results/api/$name.xml" || failed=$((failed+1))
          done < <(find "$API_DIR" -name '*.json' ! -name '*environment*' -print0)

          echo "API: $failed collections failed"
          [ "$failed" -eq 0 ]

      - name: OWASP ZAP baseline scan
        if: ${{ !cancelled() }}
        run: |
          mkdir -p results/zap
          chmod 777 results/zap

          docker run --rm --network host \
            -v "$PWD/results/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 \
            -r zap-report.html -J zap-report.json -I

      - name: Metrics
        if: ${{ !cancelled() }}
        run: |
          node scripts/qa-metrics.mjs
          cat results/metrics/metrics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: FlashGuard/playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: FlashGuard/results/
          if-no-files-found: ignore

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: FlashGuard/allure-results/
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose down -v

  allure:
    name: Allure report
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FlashGuard/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: allure-results
          path: FlashGuard/allure-results
        continue-on-error: true

      - name: Generate Allure report
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results)" ]; then
            npx allure-commandline generate allure-results -o allure-report --clean
          else
            echo "::warning::No Allure results to report"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: FlashGuard/allure-report/
          if-no-files-found: ignore
