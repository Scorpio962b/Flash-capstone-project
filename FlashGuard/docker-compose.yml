name: flash-guard

services:
  # NOTE: The database runs outside Compose (host SQL Server locally, a service container in CI).
  # If you want to run the DB in Docker again, restore the `sqlserver`, `db-init`, and `app-seed` services.

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fg-api
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-4000}                              # CHANGED: default port
      # Local: host SQL Server via host.docker.internal. CI: SQL Server service container.
      DB_HOST: ${DB_HOST:-host.docker.internal}            # CHANGED: overridable
      DB_PORT: ${DB_PORT:-1433}                            # CHANGED: overridable
      DB_NAME: ${DB_NAME:?DB_NAME is not set - create a .env file}            # CHANGED: clear error if missing
      DB_USER: ${DB_USER:?DB_USER is not set - create a .env file}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - create a .env file}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - create a .env file}
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"              # CHANGED: no more "invalid proto"
    # CHANGED: makes host.docker.internal resolve on Linux (GitHub runners); harmless on Docker Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: fg-web
    ports:
      - "${WEB_PORT:-3000}:80"                             # CHANGED: default port
    depends_on:
      api:
        condition: service_started

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: fg-mobile
    ports:
      - "${MOBILE_PORT:-8081}:80"                          # CHANGED: default port
    depends_on:
      api:
        condition: service_started

  app-seed:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: fg-app-seed
    profiles: ["seed"]
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./db/init:/db/init
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      /bin/bash -c "
      /opt/mssql-tools/bin/sqlcmd -C -S host.docker.internal,1433 -U ${DB_USER} -P '${DB_PASSWORD}' -d master -i /db/init/01-schema.sql &&
      /opt/mssql-tools/bin/sqlcmd -C -S host.docker.internal,1433 -U ${DB_USER} -P '${DB_PASSWORD}' -d ${DB_NAME} -i /db/init/99-reset-and-seed.sql
      "

volumes:
  sqlserver_data: